# GoReleaser configuration for avar.
#
# avar ships as a single self-contained binary per host (REQ-17.2, REQ-18.14):
# a macOS universal binary installable with Homebrew, and an avr.exe archive for
# each Windows architecture, installable with winget (REQ-18.15). Each host
# offers the command under both `avr` and `avar` (REQ-18.17): macOS by linking
# the one executable twice, Windows by shipping a second copy of it, because
# Windows has no link a package manager will make for you.
#
# The two declare their backend differently because their dependency stories
# are different. Lima is a package Homebrew can install, so the cask declares it
# and a macOS user never reaches avar's own install prompt (REQ-8.5). WSL is part
# of Windows and is set up with `wsl --install`, which can need elevation and a
# restart that avar must explain before acting, so the winget package declares
# no dependency and avar handles WSL itself at first run (REQ-18.3).
version: 2

project_name: avar

before:
  hooks:
    - go mod tidy
    - go vet ./...
    - go test ./...

builds:
  - id: avr
    main: .
    binary: avr
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
    goarch:
      - amd64
      - arm64
    # Keep in sync with the Makefile: main.version is the single place the
    # build stamps a version.
    ldflags:
      - -s -w -X main.version={{ .Version }}
    # Reproducible builds: derive timestamps from the commit, not the clock.
    mod_timestamp: "{{ .CommitTimestamp }}"
    flags:
      - -trimpath

  # The Windows build. It is a separate entry rather than another goos on the
  # first because the two are packaged differently: this one is not part of the
  # universal binary and ships as its own archive per architecture (REQ-18.14).
  #
  # Both architectures are built. Arm64 Windows is a real and growing target, and
  # WSL 2 runs Linux on the host processor with no emulation to fall back on, so
  # an Arm64 user given an amd64 avr.exe would be told their own machine's
  # architecture is unsupported, which it is not.
  - id: avr-windows
    main: .
    binary: avr
    env:
      - CGO_ENABLED=0
    goos:
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{ .Version }}
    mod_timestamp: "{{ .CommitTimestamp }}"
    flags:
      - -trimpath

  # avar.exe, the same program under the product's own name. On macOS the cask
  # links one executable twice, so both `avr` and `avar` work there; Windows had
  # only `avr`, and `avar true` on a real Windows host answered "The term 'avar'
  # is not recognized" (maintainer, 2026-09-22).
  #
  # It is a second build rather than a second name for one file because both
  # ways a Windows user installs avar have to give both commands. winget's
  # portable installer puts one command on PATH per entry in
  # NestedInstallerFiles, and GoReleaser generates those entries from the
  # binaries in the archive — so anything that is not a file in the zip is not a
  # command. Someone who unzips the archive onto their PATH gets exactly the
  # files in it, and no manifest can help them at all.
  #
  # Two manifest entries for one file was the cheaper route and does not work.
  # The 1.12.0 schema does allow it (NestedInstallerFiles has no uniqueItems
  # and nothing requires RelativeFilePath to be distinct), but winget's own
  # validation, which the microsoft/winget-pkgs pipeline runs, refuses it:
  # ManifestValidation.cpp keys a set on ToLower(RelativeFilePath) and raises
  # DuplicateRelativeFilePath, "Duplicate relative file path found.", at error
  # level. Because it compares the literal string, `.\avr.exe` slips past it
  # (winget-cli issue #2887, open since 2023; Fly-io.flyctl shipped 19 versions
  # that way), and GoReleaser cannot write such an entry in any case: its winget
  # pipe maps one entry per archive binary with no field to add another.
  #
  # The cost is measured, not estimated: the amd64 zip grows from 5.11 MiB to
  # 7.66 MiB and the arm64 zip from 4.58 MiB to 6.87 MiB, about 2.5 MiB each for
  # 6.4 MiB unpacked. avar.exe is byte-for-byte the same file as avr.exe (the
  # same package, flags and ldflags produce the same hash), and a zip stores each
  # entry on its own, so the copy is paid for twice on disk.
  #
  # A .bat or .cmd shim was rejected — it is a second process and a
  # second exit-code hop in front of every guest command (REQ-2.4, REQ-17.1),
  # and cmd.exe shims do not work when a command is invoked from another program
  # rather than a shell. avar putting a name on PATH itself was rejected too: the
  # guest gets nothing the user did not grant, and neither does the host.
  #
  # `avr` stays canonical. This entry changes the file name and nothing else:
  # help output, error messages and the documentation all say `avr`.
  - id: avar-windows
    main: .
    binary: avar
    env:
      - CGO_ENABLED=0
    goos:
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{ .Version }}
    mod_timestamp: "{{ .CommitTimestamp }}"
    flags:
      - -trimpath

  # avrw.exe, the program the idle-check scheduled task runs. It is avar's idle
  # check and nothing else, linked for the Windows GUI subsystem: avr.exe is a
  # console program, so a task running it in the user's session opened a
  # console window every time it fired, and a GUI-subsystem program gets no
  # console at all. `-H windowsgui` is the whole point of this entry; built
  # without it, avrw.exe opens the same window avr.exe did. It ships in the
  # same archive as avr.exe, because avar looks for it beside avr.exe.
  - id: avrw-windows
    main: ./cmd/avrw
    binary: avrw
    env:
      - CGO_ENABLED=0
    goos:
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -H windowsgui -X main.version={{ .Version }}
    mod_timestamp: "{{ .CommitTimestamp }}"
    flags:
      - -trimpath

# A universal binary means `brew install` fetches one artifact that runs on
# both Apple Silicon and Intel, which keeps the formula simple.
universal_binaries:
  - id: avr-universal
    ids:
      - avr
    # Must be the binary name, not the project name: the cask links `avr`, and
    # the default here is the project name (`avar`), which would ship an
    # archive whose binary the cask cannot find.
    name_template: avr
    replace: true

archives:
  - id: avr
    ids:
      - avr-universal
    formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_darwin_all"
    # What someone who downloads a binary needs, and nothing else. CLAUDE.md
    # shipped here until v0.1.0 was prepared: it is the working agreement for
    # people developing avar, not documentation for people running it, and it
    # only puzzles someone who unpacked a tarball to get a command.
    files:
      - README.md
      - LICENSE

  # Windows gets a zip rather than a tar.gz, because a zip is what Windows can
  # open without installing anything, and one archive per architecture rather
  # than a combined one, because there is no Windows equivalent of a universal
  # binary to combine them into.
  #
  # avrw.exe goes in the same zip, beside avr.exe, which is where avar looks for
  # it: someone who unzips the archive and keeps the folder together has both.
  # avar.exe is in the same zip for the same reason: the folder is the unit a
  # user puts on their PATH, and it carries every command avar offers.
  - id: avr-windows
    ids:
      - avr-windows
      - avar-windows
      - avrw-windows
    formats:
      - zip
    name_template: "{{ .ProjectName }}_{{ .Version }}_windows_{{ .Arch }}"
    files:
      - README.md
      - LICENSE

checksum:
  name_template: checksums.txt
  algorithm: sha256

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot-{{ .ShortCommit }}"

changelog:
  use: github
  sort: asc
  groups:
    - title: Features
      regexp: '^feat(\(.+\))?!?:'
      order: 0
    - title: Fixes
      regexp: '^fix(\(.+\))?!?:'
      order: 1
    - title: Other changes
      order: 99
  filters:
    exclude:
      - "^docs(\\(.+\\))?:"
      - "^test(\\(.+\\))?:"
      - "^chore(\\(.+\\))?:"
      - "^ci(\\(.+\\))?:"
      - Merge pull request
      - Merge branch

# Homebrew casks, not formulas: `brews` is deprecated, and a cask is the
# correct shape for a distributed macOS binary anyway.
homebrew_casks:
  - name: avar
    ids:
      - avr
    directory: Casks
    repository:
      owner: olamide226
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    binaries:
      - avr
    # Keep `avr` as the canonical command, but also link the same executable
    # under the product name for people who naturally type `avar`.
    custom_block: |
      binary "avr", target: "avar"
    homepage: https://github.com/olamide226/avar
    description: Run your current directory in Linux
    # Lima is avar's virtualization backend. Declaring it here is what
    # satisfies REQ-8.5: Homebrew users get Lima installed alongside avar and
    # never reach the interactive install offer in REQ-8.2.
    dependencies:
      - formula: lima
    commit_msg_template: "avar {{ .Tag }}"
    # avar's idle check is a per-user launchd agent that avar writes itself, so
    # Homebrew does not know about it. It is removed on `--zap` rather than in
    # `uninstall`, deliberately. Homebrew runs the whole `uninstall` stanza on
    # every `brew upgrade` too (only `signal` is skipped), so the agent would
    # disappear at each upgrade and idle stopping would halt until the next
    # `avr` put it back. Homebrew's `launchctl` directive also looks the label
    # up with sudo, which can ask for a password. A plain uninstall leaves an
    # inert agent; the README says how to remove it, and the caveat says
    # `--zap` does.
    zap:
      launchctl:
        - com.avar.idle-check
    caveats: |
      avar registers a background idle check (launchd agent com.avar.idle-check)
      the first time it creates an environment. `brew uninstall --zap avar`
      removes it with avar; see the README's Uninstall section.
    # Released binaries are unsigned, so strip the quarantine attribute that
    # would otherwise make Gatekeeper refuse the first run.
    hooks:
      post:
        install: |
          if OS.mac?
            system "xattr", "-d", "-r", "com.apple.quarantine", "#{staged_path}/avr"
          end

# The Windows Package Manager. `winget install olamide226.avar` installs the
# same zip archives the release publishes, as a portable package: winget unpacks
# the archive for the host's architecture and puts `avr` on the user's PATH.
#
# Unlike the Homebrew tap, the repository winget reads is not ours. GoReleaser
# pushes the manifests to a fork of microsoft/winget-pkgs and opens a pull
# request against it, so a version reaches `winget install` only once
# Microsoft's validation has merged that pull request, which takes hours or days
# rather than seconds.
#
# No WSL dependency is declared, though winget carries a Microsoft.WSL package.
# Installing it needs elevation and would prompt for it mid-install with no
# explanation, and it does not do everything `wsl --install` does. avar's own
# first-run check already identifies what is missing and says what it is about
# to do before doing it (REQ-18.3); a package dependency would bypass exactly
# that.
winget:
  - name: avar
    package_identifier: olamide226.avar
    package_name: avar
    publisher: olamide226
    publisher_url: https://github.com/olamide226
    publisher_support_url: https://github.com/olamide226/avar/issues
    author: Ola Adebayo
    ids:
      - avr-windows
    homepage: https://github.com/olamide226/avar
    short_description: Run your current directory in Linux
    description: |
      avar runs the directory you are standing in inside Linux, with nothing to
      configure: `avr` opens a Linux shell there, and `avr <command>` runs one
      command. On Windows each environment is a WSL 2 distribution avar creates
      and manages; the same commands work on macOS through Lima.
    license: Apache-2.0
    license_url: https://github.com/olamide226/avar/blob/main/LICENSE
    release_notes_url: "https://github.com/olamide226/avar/releases/tag/{{ .Tag }}"
    # winget runs nothing of avar's when it uninstalls a portable package, so
    # the idle-check task avar registers cannot be removed with it. Saying how
    # at install time is the best available: the note is shown then.
    installation_notes: avar needs WSL 2. The first time you run `avr` it checks for WSL and offers to set it up, saying before it acts whether that needs administrator approval or a restart. avar also registers a scheduled task, avar-idle-check, that stops idle environments. Before `winget uninstall`, remove it with `schtasks /Delete /TN avar-idle-check /F`.
    tags:
      - cli
      - linux
      - wsl
      - developer-tools
    commit_msg_template: "New version: {{ .PackageIdentifier }} {{ .Version }}"
    # Submitted for minor and major releases only (x.y.0). Every `feat:` or
    # `fix:` merge releases, and on 16 September that opened five pull
    # requests on microsoft/winget-pkgs in 45 minutes for a package still in
    # its first review. Each is reviewed by people, so avar submits a version
    # worth their time rather than every patch. Patch releases still reach
    # GitHub and Homebrew. Without the WINGET_TOKEN secret nothing is
    # submitted, so a release never fails for want of it; `auto` keeps
    # prereleases out.
    skip_upload: '{{ if and (isEnvSet "WINGET_TOKEN") (eq .Patch 0) }}auto{{ else }}true{{ end }}'
    repository:
      owner: olamide226
      name: winget-pkgs
      branch: "avar-{{ .Version }}"
      # The same form as the Homebrew token, and for a measured reason: a
      # repository token is templated with fewer functions than other fields.
      # `envOrDefault` works in skip_upload but failed here on GoReleaser
      # 2.18.1 ("function not defined"), after the GitHub release had already
      # been published. The workflow always passes WINGET_TOKEN, empty when the
      # secret is unset, so the key is always present.
      token: "{{ .Env.WINGET_TOKEN }}"
      pull_request:
        enabled: true
        base:
          owner: microsoft
          name: winget-pkgs
          branch: master

release:
  github:
    owner: olamide226
    name: avar
  draft: false
  prerelease: auto
  footer: |
    ## Installation

    **macOS**

    ```bash
    brew install --cask olamide226/tap/avar
    ```

    Lima is installed automatically as a dependency.

    **Windows**

    ```powershell
    winget install olamide226.avar
    ```

    winget receives minor releases (x.y.0), each once Microsoft merges its
    manifest, which can lag the release by a day or two. Or download the `windows_amd64` or
    `windows_arm64` archive below, unzip it, and put the whole folder somewhere
    on your PATH: `avr.exe` is the command, `avar.exe` is the same program under
    the longer name, and `avrw.exe` runs the background idle check without
    opening a window. avar needs WSL 2 and offers to set it up the first time
    you run it.

    Binaries are unsigned. Windows SmartScreen may warn on first run.
