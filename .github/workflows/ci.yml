name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # macOS is avar's only supported host platform (REQ-17.6), so unit and
  # integration tests run there. E2E tests are not in CI: they provision real
  # virtual machines and run via `make e2e` on a developer machine.
  test:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify formatting and vet
        run: make lint

      - name: Verify go.mod is tidy
        run: make tidy-check

      - name: Test release versioning
        run: make release-version-test

      - name: Build
        run: make build

      - name: Test
        run: make test

  # Windows is not a supported host yet — REQ-18.1 is Phase 4 — but avar's
  # portable packages have to keep building and passing there while the
  # WSL2Provider is built beside the Lima one. Without this job the Windows
  # build regresses silently between tasks, which is how it came to be broken in
  # the first place: `go build ./...` had never once been run on a Windows host.
  #
  # The suite is `./...` rather than a list of packages. Tests asserting
  # macOS-only behaviour carry a `unix` build constraint or skip themselves with
  # a stated reason, so what runs here is what is meaningful here, and a package
  # that becomes meaningful needs no change to this file.
  #
  # The steps call the Go tool directly rather than going through the Makefile,
  # which is a POSIX shell script: `make` is not on a Windows runner's PATH, and
  # `make test` asks for the race detector, which needs a C toolchain that a
  # Windows runner does not reliably have. Race coverage comes from the macOS
  # job, which runs the same tests.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify formatting
        shell: bash
        run: |
          unformatted=$(gofmt -s -l cmd internal e2e main.go)
          if [ -n "$unformatted" ]; then
            echo "gofmt -s needed:"; echo "$unformatted"; exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./...

  # The WSL end-to-end suite against a real WSL 2 installation.
  #
  # It is a separate job, and `continue-on-error` for now, because WSL 2 on a
  # hosted runner rests on nested virtualization that GitHub provides but does
  # not support: it works today and carries no promise that it will keep
  # working. A red cross here should tell us that before it blocks anybody's
  # merge. Once it has proven itself over a few weeks, drop continue-on-error
  # and it becomes a real gate.
  #
  # Running it at all is worth doing because the cost is far lower than the
  # 45-minute timeout suggests. Measured on a developer machine: the whole suite
  # is 68-88 seconds, of which the cold-start test — which downloads a root
  # filesystem and provisions it — is 34 seconds and every other test is under
  # three. A fresh runner has nothing cached, so budget more than that for the
  # download, but this is not a suite that needs sampling or splitting.
  #
  # These tests are what turned Phase 4 from unit-tested-against-a-fake into
  # exercised-against-the-tool, and they found four defects that twenty-nine
  # unit tests had agreed did not exist. Running them only when somebody
  # remembers is how that happens again.
  wsl-e2e:
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Report the WSL the runner has
        shell: bash
        run: wsl.exe --version || echo "no usable WSL on this runner"

      # PROP-6 — that avar never stops a distribution it does not own — can only
      # be checked against a distribution avar does not own. A runner has none,
      # so one is installed here. Without it that test skips, and a security
      # property that skips reports green while testing nothing.
      #
      # --no-launch keeps the first-run wizard away; the test starts it itself.
      - name: Install a distribution avar does not own
        shell: bash
        run: wsl.exe --install Ubuntu-24.04 --no-launch --web-download || echo "could not install one; the PROP-6 check will fail loudly"

      # AVR_E2E_REQUIRE_FOREIGN turns that test's skip into a failure. Here the
      # environment is arranged, so a missing foreign distribution means the
      # arrangement broke rather than that the host happens to be bare.
      - name: E2E against real WSL
        shell: bash
        env:
          AVR_E2E_REQUIRE_FOREIGN: "1"
        run: go test -tags=e2e -timeout=45m -count=1 ./e2e/...
