name: Docs site

# Builds the documentation site in site/ and publishes it to GitHub Pages at
# https://olamide226.github.io/avar/.
#
# Pull requests build the site and stop, so a page that does not render — a
# `{% link %}` to a page that does not exist, a Liquid error, broken front
# matter — fails the pull request rather than main. Only a push to main, or a
# manual run on main, deploys.
#
# Deploying needs Pages enabled with "GitHub Actions" as its source
# (Settings → Pages → Build and deployment). Until it is, the build job still
# runs and the deploy job fails; nothing else depends on it.
#
# What this workflow does not check: that the generated sections of the site
# match avar's help text and environment matrix. That is a Go test
# (cmd/docsite_test.go) and runs in CI with the rest of the suite.

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  pull_request:
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  # For the first deploy after Pages is enabled, and for redeploying without a
  # change to the site.
  workflow_dispatch:

permissions:
  contents: read

# A deploy is never cancelled part-way; a newer one waits for it instead.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4

      # The Ruby version matches the one Gemfile.lock was resolved with, and
      # the gem versions come from that lockfile, so this build and a local
      # `bundle exec jekyll build` render with the same theme.
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
          bundler-cache: true
          working-directory: site

      # baseurl is fixed in _config.yml rather than taken from
      # actions/configure-pages, which fails when Pages is not yet enabled and
      # so would fail every pull request until it is.
      - name: Build
        run: bundle exec jekyll build --strict_front_matter
        env:
          JEKYLL_ENV: production

      # A reviewer can read a pull request's site before it deploys. The
      # artifact is the built site; baseurl is /avar, so it has to be served
      # from a directory of that name for its links and styles to resolve.
      - name: Upload a preview of the site
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: docs-site-preview
          path: site/_site
          retention-days: 14

      - name: Explain how to preview it
        if: github.event_name == 'pull_request'
        run: |
          {
            echo "## Previewing this pull request's docs site"
            echo
            echo "1. Download the \`docs-site-preview\` artifact from this run's Summary page."
            echo "2. Unzip it into a directory named \`avar\`: \`mkdir -p preview/avar && unzip docs-site-preview.zip -d preview/avar\`"
            echo "3. Serve the parent directory: \`cd preview && python3 -m http.server 4000\`"
            echo "4. Open http://localhost:4000/avar/"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the site
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site/_site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: https://olamide226.github.io/avar/
    steps:
      - uses: actions/deploy-pages@v5
